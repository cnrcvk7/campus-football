server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Security headers  (applied in every location — add_header does not
    # inherit when a location block defines its own add_header directives)
    # ---------------------------------------------------------------------------
    # NOTE: Content-Security-Policy is intentionally omitted.
    # All resource origins (fonts, scripts, API) must be audited before
    # enforcing a policy without breaking the application.  Add a CSP once
    # you have mapped every source used at runtime.
    #
    # NOTE: TLS termination belongs at the external reverse proxy or load
    # balancer (nginx, Caddy, AWS ALB, etc.), NOT inside this container.
    # See docs/PRODUCTION_DEPLOY.md § Reverse proxy requirement.

    # ---------------------------------------------------------------------------
    # API proxy  (internal Docker network — no cross-origin request needed)
    # ---------------------------------------------------------------------------
    # The React API client uses relative paths (/api/...).  In development
    # the Vite dev server proxies them; in production this nginx block does.
    # The backend service is reachable on the Docker-internal hostname "backend".
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        add_header X-Frame-Options         "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options  "nosniff"                      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------------------
    # Static assets  (Vite hashes filenames — cache aggressively)
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires        1y;
        add_header     Cache-Control              "public, immutable";
        add_header     X-Frame-Options            "SAMEORIGIN"                   always;
        add_header     X-Content-Type-Options     "nosniff"                      always;
        add_header     Referrer-Policy            "strict-origin-when-cross-origin" always;
        try_files      $uri =404;
    }

    # ---------------------------------------------------------------------------
    # SPA entry point  (never cache index.html — it references hashed assets)
    # ---------------------------------------------------------------------------
    location = /index.html {
        expires   -1;
        add_header Cache-Control              "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options            "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options     "nosniff"                      always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback  (client-side routing via react-router-dom BrowserRouter)
    # ---------------------------------------------------------------------------
    location / {
        add_header X-Frame-Options         "SAMEORIGIN"                   always;
        add_header X-Content-Type-Options  "nosniff"                      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
