# Production deployment — standalone Compose file (not an overlay).
#
# Network topology
# ────────────────
#   External reverse proxy / LB
#       │  :443 (TLS terminated here — NOT inside this stack)
#       │  :80  → redirect to :443
#       ↓
#   frontend  :80  (nginx — serves React SPA + proxies /api/ to backend)
#       │  internal Docker network only
#       ↓
#   backend   :8000  (gunicorn — not exposed to host)
#       │  internal Docker network only
#       ↓
#   db        :5432  (postgres — not exposed to host)
#
# The frontend container is the single external ingress.  Your reverse proxy
# should forward ALL traffic (both static and /api/) to frontend:80.
# backend and db have no published ports.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in all required values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See docs/PRODUCTION_DEPLOY.md for environment variable requirements,
# secret-key generation, and a safe deployment checklist.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Credentials come from .env.prod so db and backend always use the same
    # values.  Do NOT add an environment: block here — it would be resolved
    # via Compose interpolation from the local .env file (dev defaults) and
    # would silently override the env_file values, causing a credential split.
    env_file:
      - .env.prod
    # No `ports:` — the database is not exposed to the host in production.
    # All access goes through the internal Docker network.
    healthcheck:
      # $$POSTGRES_USER expands inside the container (single $ after YAML
      # processing), so it reads the value injected by env_file, not the
      # Compose-interpolation value from .env.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # No source-code bind mount — the immutable image is used as-is.
    # No `ports:` — backend is only reachable via the frontend nginx proxy
    # on the internal Docker network (hostname "backend", port 8000).
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input &&
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 2 \
          --timeout 60 \
          --access-logfile - \
          --error-logfile -

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No target — uses the final "prod" stage (nginx + compiled dist).
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    # NGINX_TRUSTED_PROXY is the only runtime variable the nginx container
    # needs.  It is read by docker-entrypoint.sh at startup to configure
    # ngx_http_realip_module (real client IP → correct per-IP throttling).
    # No React VITE_* variables are needed here: the API client uses a
    # relative base URL (/api) that nginx proxies internally.
    env_file:
      - .env.prod

volumes:
  postgres_data:
